name: release

on:
  push:
    tags: ["v*"]

jobs:
  pypi:
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write   # PyPI Trusted Publishing (OIDC) - no token needed
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install build
      - run: python -m build
      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1

  github-release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Create GitHub release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true

  homebrew:
    # Auto-bump the Homebrew tap formula (url + sha256 + version) to this tag.
    # Requires a repo secret HOMEBREW_TAP_TOKEN: a PAT with contents:write on
    # insideaayush/homebrew-tap. See RELEASING.md.
    needs: github-release
    runs-on: ubuntu-latest
    steps:
      - name: Bump tap formula
        uses: mislav/bump-homebrew-formula-action@v3
        with:
          formula-name: chat-memory-sync
          formula-path: Formula/chat-memory-sync.rb
          homebrew-tap: insideaayush/homebrew-tap
          base-branch: main
          tag-name: ${{ github.ref_name }}
          download-url: https://github.com/insideaayush/chat-memory-sync/archive/refs/tags/${{ github.ref_name }}.tar.gz
          commit-message: |
            chat-memory-sync {{version}}

            Automated bump from release ${{ github.ref_name }}.
        env:
          COMMITTER_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}

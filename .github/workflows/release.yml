name: release

on:
  push:
    tags: ["v*"]
  workflow_dispatch: {}

jobs:
  pypi:
    runs-on: ubuntu-latest
    # Tolerate failure until PyPI Trusted Publishing is configured (see RELEASING.md).
    continue-on-error: true
    environment: pypi
    permissions:
      id-token: write   # PyPI Trusted Publishing (OIDC) - no token needed
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install build
      - run: python -m build
      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1

  github-release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Create GitHub release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true

  homebrew:
    # Auto-bump the Homebrew tap formula (url + sha256) to this tag by committing
    # directly to the tap. Requires repo secret HOMEBREW_TAP_TOKEN: a PAT with
    # Contents:write on insideaayush/homebrew-tap. See RELEASING.md.
    needs: github-release
    runs-on: ubuntu-latest
    steps:
      - name: Bump tap formula
        env:
          TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}
          TAG: ${{ github.ref_name }}
          TAP: insideaayush/homebrew-tap
          FORMULA: Formula/chat-memory-sync.rb
          REPO: insideaayush/chat-memory-sync
        run: |
          set -euo pipefail
          VER="${TAG#v}"
          URL="https://github.com/${REPO}/archive/refs/tags/${TAG}.tar.gz"
          SHA=$(curl -fsSL "$URL" | sha256sum | awk '{print $1}')
          echo "version=$VER url=$URL sha=$SHA"
          git clone --depth 1 "https://x-access-token:${TOKEN}@github.com/${TAP}.git" tap
          cd tap
          sed -i -E "s|url \"[^\"]*\"|url \"${URL}\"|" "$FORMULA"
          sed -i -E "s|sha256 \"[^\"]*\"|sha256 \"${SHA}\"|" "$FORMULA"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if git diff --quiet; then echo "no change"; exit 0; fi
          git commit -am "chat-memory-sync ${VER} (automated bump from ${TAG})"
          git push origin HEAD
